name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '**.java'
      - '**.tsx'
      - '**.ts'
      - '**.sql'
      - '**.yml'
      - '**.gradle'
      - '**.properties'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install google-genai
        run: pip install google-genai

      - name: Get PR diff
        run: |
          git diff -U15 ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr_diff.txt
          echo "Diff lines: $(wc -l < pr_diff.txt)"

      - name: Run Gemini review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: gemini-3
        run: |
          cat > gemini_review.py << 'SCRIPT_EOF'
          import os, sys
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY", "")
          model = os.environ.get("MODEL", "gemini-3")
          if not api_key:
              print("ERROR: GEMINI_API_KEY not set")
              sys.exit(1)

          with open("pr_diff.txt", "r") as f:
              diff = f.read()

          if not diff.strip():
              with open("review.txt", "w") as f:
                  f.write("## Gemini Code Review\n\nНет изменений для ревью.")
              sys.exit(0)

          prompt = (
              "Изменения в PR (diff):\n"
              + diff[:30000]
              + "\n\n"
              + "Ты эксперт по Java и Spring Boot. Data Forge Middleware:\n"
              + "- REST API (Device Code Flow OAuth), AWS S3, PostgreSQL 16, Spring Boot 3.5\n"
              + "- DDD архитектура, агрегаты: Account, Site, Batch, ErrorLog, Plugin\n\n"
              + "Проверь на:\n"
              + "1. Error handling (400/403/404/413/500)\n"
              + "2. @Transactional на уровне сервиса\n"
              + "3. JPA N+1 (JOIN FETCH)\n"
              + "4. Мультитенантность (accountId)\n"
              + "5. Безопасность (SQL injection, XSS)\n"
              + "6. Качество unit-тестов\n\n"
              + "Формат: 🔴 Критично / 🟡 Рекомендация / 🟢 Хорошо\n"
              + "Отвечай на русском. Указывай файлы и строки."
          )

          try:
              client = genai.Client(api_key=api_key)
              response = client.models.generate_content(
                  model=model,
                  contents=prompt,
                  config=types.GenerateContentConfig(temperature=0.0)
              )
              review = response.text
          except Exception as e:
              print(f"Gemini API error: {e}")
              review = f"Ошибка вызова Gemini API: {e}"

          with open("review.txt", "w") as f:
              f.write("## Gemini Code Review\n\n")
              f.write(review)

          print("Review complete")
          SCRIPT_EOF
          python3 gemini_review.py

      - name: Post review comment
        if: always()
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: review.txt
          reactions: '+1'
