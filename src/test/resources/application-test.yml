# Test Profile Configuration
# Overrides for integration tests

# Delta v2 gRPC server is not bound in tests (contract tests use in-process servers)
delta:
  grpc:
    enabled: false
  egress:
    # Slow sweep so tests exercise the explicit commit-time wake, not the fallback
    sweep-ms: 3600000
  batch-parquet:
    sweep-ms: 3600000

spring:
  main:
    allow-bean-definition-overriding: true  # Allow test beans to override production beans

  datasource:
    hikari:
      # A run keeps every distinct Spring context in the context cache, and each context holds
      # its own pool. The production defaults (max 12, min-idle 5) reserve about five connections
      # per cached context even while it sits idle, so roughly twenty contexts exhaust
      # PostgreSQL's default max_connections=100. The next context then fails to boot, Flyway
      # reports it as a connection error, and it surfaces as an ApplicationContext failure in
      # whichever test class happens to load last — a failure that looks unrelated to the change
      # that caused it and does not reproduce when that class is run on its own.
      #
      # Holding no idle connections makes a cached-but-inactive context free, so adding a test
      # class no longer pushes the suite over a cliff.
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000

  task:
    scheduling:
      # The scheduler pool has to stay below the connection pool above (issue #146), and the pool
      # above is four here rather than the production ten. Every context boots its scheduled tasks,
      # eight of which are due immediately and several of which open a connection, so the shipped
      # six would put scheduler threads in competition with Flyway and the test's own queries.
      # Nothing in the suite asserts scheduling concurrency against this profile —
      # ScheduledTaskIsolationTest builds its own context from the shipped values.
      #
      # This is deliberately below the production floor (a thread free while all three long tasks
      # run, i.e. four), and it has to be: four is not below the four connections above, so the two
      # rules cannot both hold here. Timeliness is a production property, connection pressure is the
      # one that bites in a suite of cached contexts, so the smaller number wins and
      # shouldSizeThePoolAboveTheLongRunningTasks checks the shipped profile only.
      pool:
        size: 2

# LocalStack S3 configuration for tests
s3:
  bucket:
    name: data-forge-test-bucket  # LocalStack S3 bucket for tests
  endpoint: http://localhost:4566  # LocalStack endpoint
  region: us-east-1
  access-key: test  # LocalStack dummy credentials
  secret-key: test  # LocalStack dummy credentials

# Plugin SQL generation settings for tests
plugin:
  sql-generation:
    heap-threshold-percent: 100  # Disable memory pressure check in tests

# Auth0 configuration for tests (mock)
auth0:
  domain: test-domain.auth0.com
  management:
    client-id: test-client-id
    client-secret: test-secret
    audience: https://test-domain.auth0.com/api/v2/
  api:
    audience: https://api.test.com
    issuer: https://test-domain.auth0.com/
    claims-namespace: https://api.test.com
