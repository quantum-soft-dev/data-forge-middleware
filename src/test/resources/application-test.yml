# Test Profile Configuration
# Overrides for integration tests

# Delta v2 gRPC server is not bound in tests (contract tests use in-process servers)
delta:
  grpc:
    enabled: false
  egress:
    # Slow sweep so tests exercise the explicit commit-time wake, not the fallback
    sweep-ms: 3600000
  batch-parquet:
    sweep-ms: 3600000
    # See delta.checkpoint.temp-dir below — the two keys are declared for one reason and are
    # deliberately separate directories.
    temp-dir: ${dfm.test.parquet-scratch-root:build/test-scratch/parquet}/batch-parquet
  checkpoint:
    # Undeclared, this key and its batch-parquet twin fall back to ${java.io.tmpdir}, so every
    # cached Spring context boots a ParquetScratchOrphanSweeper over the machine-wide temp
    # directory — and that sweeper deletes any regular file named checkpoint-* / batch-parquet-*
    # older than four hours, whoever wrote it. The suite was both the victim (#168: a file it did
    # not own vanished between two listings) and the perpetrator (#187: a run deleted another
    # worktree's scratch, and wrote production-shaped scratch into the host's /tmp).
    #
    # dfm.test.parquet-scratch-root is the absolute build directory, supplied by every Gradle Test
    # task; the relative default keeps an IDE run that does not set it inside the build tree too.
    # Separate subdirectories per writer, as CheckpointParquetIntegrationTest already does for its
    # own context, so a completed-batch drain cannot leave a file where a checkpoint assertion
    # looks. ParquetScratchTestProfileTest and ParquetScratchSweepIsolationIntegrationTest hold
    # both halves of this.
    temp-dir: ${dfm.test.parquet-scratch-root:build/test-scratch/parquet}/checkpoint
    # 600 s in production (issue #178). Two checkpoint builds never overlap in a suite that
    # drives them one call at a time, so this only decides how a bug shows up: at the shipped
    # value a test that did contend would hang the run for ten minutes before failing, where
    # this fails it as a deferral while there is still something to read.
    fold-wait-seconds: 30
  parquet:
    # Production is already 1 h; declare it here so a later cut of the production
    # default cannot silently restore a fast tick under test (issue #167).
    scratch-orphan-sweep-ms: 3600000
  s3-orphan:
    # Off under test, structurally rather than by assuming a suite shorter than the 10-minute
    # initial delay: a longer integrationTest run would otherwise fire the real tick against the
    # shared LocalStack bucket, and "the age filter spares everything a test wrote" is the kind of
    # incidental safety #167 refused to rely on. The integration test builds its own sweeper.
    enabled: false
    # Production is 24 h; declare it so a later cut of the production default cannot restore a
    # fast tick under test (issue #167).
    sweep-ms: 3600000
  ingestion:
    # 5 min / 15 min in production. A suite longer than that would otherwise race
    # these ticks in every cached context; tests that need them call the methods.
    staged-sweep-millis: 3600000
    provisional-sweep-millis: 3600000

spring:
  main:
    allow-bean-definition-overriding: true  # Allow test beans to override production beans

  datasource:
    hikari:
      # A run keeps every distinct Spring context in the context cache, and each context holds
      # its own pool. The production defaults (max 10, min-idle 5) reserve about five connections
      # per cached context even while it sits idle, so roughly twenty contexts exhaust
      # PostgreSQL's default max_connections=100. The next context then fails to boot, Flyway
      # reports it as a connection error, and it surfaces as an ApplicationContext failure in
      # whichever test class happens to load last — a failure that looks unrelated to the change
      # that caused it and does not reproduce when that class is run on its own.
      #
      # Holding no idle connections makes a cached-but-inactive context free, so adding a test
      # class no longer pushes the suite over a cliff.
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000

  task:
    scheduling:
      # The scheduler pool has to stay below the connection pool above (issue #146), and the pool
      # above is four here rather than the production ten. Every context boots its scheduled tasks,
      # eight of which are due immediately and several of which open a connection, so the shipped
      # six would put scheduler threads in competition with Flyway and the test's own queries.
      # Nothing in the suite asserts scheduling concurrency against this profile —
      # ScheduledTaskIsolationTest builds its own context from the shipped values.
      #
      # This is deliberately below the production floor (a thread free while all three long tasks
      # run, i.e. four), and it has to be: four is not below the four connections above, so the two
      # rules cannot both hold here. Timeliness is a production property, connection pressure is the
      # one that bites in a suite of cached contexts, so the smaller number wins and
      # shouldSizeThePoolAboveTheLongRunningTasks checks the shipped profile only.
      pool:
        size: 2

# LocalStack S3 configuration for tests
s3:
  bucket:
    name: data-forge-test-bucket  # LocalStack S3 bucket for tests
  endpoint: http://localhost:4566  # LocalStack endpoint
  region: us-east-1
  access-key: test  # LocalStack dummy credentials
  secret-key: test  # LocalStack dummy credentials

# Plugin SQL generation settings for tests
plugin:
  sql-generation:
    # Disables the memory-pressure abort: it needs heap usage strictly above the threshold, and
    # 100% is unreachable. Before #174 the comparison was non-strict and the reading is
    # ceiling-rounded, so this line aborted generation for any usage above 99% — silently, as
    # "no changes detected", in whichever integration test happened to run at that moment.
    heap-threshold-percent: 100
    # Slow sweep so tests exercise the explicit wake, not the fallback — the same reason
    # delta.egress.sweep-ms and delta.batch-parquet.sweep-ms are slowed above, and an omission
    # when 026 added this queue (issue #159).
    #
    # At the shipped 60s this tick fired in *every* cached Spring context for the whole run, and
    # its drain claims the head pending segment of any site, not of the class under test. Before
    # #164 that drain rendered inside a wrapping transaction (S3 included), so a sweep of a
    # context whose test class finished long ago could hold row locks on
    # changelog_segments/plugin_sql_generations while the next class's @Sql("/test-data.sql")
    # tried to delete those very rows — the ScriptStatementFailedException seen in
    # BitBiDeltaSqlIntegrationTest's setup — and could write a generation the running method then
    # counted. The wrapping transaction is gone (#164); the claim itself is still a
    # SKIP LOCKED write, so a leftover drain can still race @Sql. Tests that need the queue
    # drained do it explicitly (drainQueue()) or through the event-time
    # DeltaSqlSweepWorker.wake(), which reinit and BATCH_COMPLETED still call.
    #
    # What this does NOT remove: @Scheduled(fixedDelayString=...) has no initial delay, so each
    # context still runs exactly one drain when it is created. That is a fixed cost of roughly one
    # per cached context instead of one per context per minute for the length of the run.
    # ScheduledTaskTestProfileCadenceTest allowlists that first tick (a production initialDelay
    # would delay crash-recovery) and fails if this key is omitted or restored to 60 s (#167).
    delta-sweep-ms: 3600000

# Auth0 configuration for tests (mock)
auth0:
  domain: test-domain.auth0.com
  management:
    client-id: test-client-id
    client-secret: test-secret
    audience: https://test-domain.auth0.com/api/v2/
  api:
    audience: https://api.test.com
    issuer: https://test-domain.auth0.com/
    claims-namespace: https://api.test.com
