spring:
  datasource:
    # Use DB_URL to support both host-run (localhost) and container-run (postgres service) setups.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dfm}
    username: dfm
    password: dfm_password

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis_password}

  flyway:
    locations: classpath:db/migration,classpath:db/seed

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0 dev tenant - override with actual values
          issuer-uri: https://${AUTH0_DOMAIN:dev-example.us.auth0.com}/
          audiences: ${AUTH0_AUDIENCE:https://api.dataforge.com}

# Auth0 Development Configuration
auth0:
  domain: ${AUTH0_DOMAIN:dev-example.us.auth0.com}
  management:
    client-id: ${AUTH0_MGMT_CLIENT_ID:}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
    audience: ${AUTH0_MGMT_AUDIENCE:https://dev-example.us.auth0.com/api/v2/}
  api:
    audience: ${AUTH0_AUDIENCE:https://api.dataforge.com}
    issuer: ${AUTH0_ISSUER:https://dev-example.us.auth0.com/}
  database-connection: Username-Password-Authentication

s3:
  # Use AWS_S3_ENDPOINT to support both host-run (localhost) and container-run (localstack service) setups.
  endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
  region: ${AWS_S3_REGION:us-east-1}
  bucket:
    name: ${AWS_S3_BUCKET_NAME:data-forge-bucket}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  path-style-access-enabled: false

jwt:
  secret: dev-secret-key-minimum-256-bits-required-for-hmac-sha256-algorithm-development
  expiration-minutes: 60

batch:
  timeout-minutes: 60

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha

# Device Authorization Flow Configuration (dev environment)
device-authorization:
  verification-uri: https://dev.dfm.bitbi.io/device-verify

# Application base URL (dev environment)
app:
  api-base-url: https://dev.dfm.bitbi.io

logging:
  level:
    root: INFO
    com.bitbi.dfm: DEBUG
    com.bitbi.dfm.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.auth0: DEBUG
