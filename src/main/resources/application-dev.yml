spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dfm
    username: dfm
    password: dfm_password

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis_password}

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/dfm
          jwk-set-uri: http://localhost:8081/realms/dfm/protocol/openid-connect/certs

keycloak:
  auth-server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:dfm}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

s3:
  endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
  region: ${AWS_S3_REGION:us-east-1}
  bucket:
    name: ${AWS_S3_BUCKET_NAME:data-forge-bucket}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  path-style-access-enabled: false

jwt:
  secret: dev-secret-key-minimum-256-bits-required-for-hmac-sha256-algorithm-development
  expiration-minutes: 60

batch:
  timeout-minutes: 60

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.bitbi.dfm: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
