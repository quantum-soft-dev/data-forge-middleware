spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:16-alpine:///dfm_test

  # Disable Redis for tests (caching not critical for test execution)
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/dfm-test
          jwk-set-uri: http://localhost:8081/realms/dfm-test/protocol/openid-connect/certs

# Auth0 Configuration for tests (mocked by TestAuth0Config and MockAuth0JwtDecoder)
# enabled: false flag ensures real Auth0 connections are disabled in tests
auth0:
  enabled: false  # Disable Auth0 integration in tests - use mocks instead
  domain: test.auth0.com
  management:
    audience: https://test.auth0.com/api/v2/
  api:
    audience: https://api.test.com
    issuer: https://test.auth0.com/
  database-connection: Username-Password-Authentication
  password-reset-ttl-seconds: 86400
  roles-namespace: https://api.dataforge.com/roles

s3:
  endpoint: http://localhost:4566
  region: us-east-1
  bucket:
    name: data-forge-test-bucket
  access-key: test
  secret-key: test
  path-style-access-enabled: true

# Batch Configuration for tests
batch:
  timeout:
    minutes: 60
  max:
    active:
      per-account: 10

# Upload Configuration for tests
upload:
  max:
    file-size-mb: 128
    files-per-batch: 1000
  retry:
    attempts: 3
    delay-ms: 1000

# JWT Configuration for tests
jwt:
  secret: test-secret-key-for-unit-tests-at-least-256-bits-long-hmac-sha256
  expiration-seconds: 86400

# Keycloak Configuration for tests
keycloak:
  enabled: false  # Disable Keycloak integration in tests
  realm: dfm-test
  auth-server-url: http://localhost:8081
  resource: dfm-backend-test
  credentials:
    secret: test-client-secret
  use-resource-role-mappings: false
  bearer-only: true
  admin:
    client-id: admin-cli
    client-secret: test-admin-secret

logging:
  level:
    root: WARN
    com.bitbi.dfm: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.testcontainers: INFO

# Delta v2 gRPC server is not bound in tests (contract tests use in-process servers)
delta:
  grpc:
    enabled: false
  egress:
    # Slow sweep so tests exercise the explicit commit-time wake, not the fallback
    sweep-ms: 3600000
