spring:
  application:
    name: data-forge-middleware

  threads:
    virtual:
      enabled: true

  task:
    scheduling:
      pool:
        # Threads shared by every @Scheduled method and by BatchRetentionScheduler's dynamic cron
        # (issue #146). One is Spring Boot's default and is what the application effectively had:
        # a checkpoint build, which can run for hours, postponed the scratch sweep, the batch
        # timeout sweep and the monthly partition creation behind it.
        #
        # Six is derived, not guessed: FOUR of the fifteen scheduled tasks can hold their thread for
        # minutes — the nightly checkpoint build and the retention cleanup (both due at 02:00 by
        # default), the orphaned-provisional sweep in its 500-segment worst case, and the batch
        # timeout sweep once a backlog makes its unbounded query and single transaction long. So the
        # floor is FIVE, for a short tick never to queue behind them; six is that floor plus one for
        # the burst of short ticks that fall on the same second, and
        # stays below spring.datasource.hikari.maximum-pool-size (10). Adding a scheduled task that
        # blocks means revisiting this — ScheduledTaskInventoryTest fails until the audit is redone.
        #
        # Read that last bound for exactly what it is: the scheduler on its own cannot empty the
        # connection pool. It is not a guarantee about total background demand — the queue workers
        # and the plugin executors hold connections too. That wider audit is issue #161, and it
        # lives beside spring.datasource.hikari.maximum-pool-size below; this pool is one of its
        # terms, and the largest, so moving it moves that derivation as well.
        #
        # Five of the fifteen tasks never open a connection at all (the three queue-worker sweeps,
        # which only wake their own pool, the scratch sweep, which touches the filesystem, and the
        # Auth0 token refresh, which is an HTTP call). Ten can — but only the four classified
        # Cost.LONG hold one long enough for the connection pool to have to reserve for them, which
        # is the term the derivation below actually uses. The rest release between statements.
        #
        # The key is the standard Spring Boot one, so SPRING_TASK_SCHEDULING_POOL_SIZE overrides it
        # without a placeholder of our own. It only takes effect because SchedulingConfiguration
        # declares the TaskScheduler bean: under spring.threads.virtual.enabled the auto-configured
        # scheduler is a SimpleAsyncTaskScheduler, which this key does not configure at all.
        size: 6

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${auth0.domain}/
          audiences: ${auth0.api.audience}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dfm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized against total background thread demand, not just request threads (issue #161).
      # BackgroundConnectionDemandTest keeps every number below honest and fails when a new
      # background pool lands without this arithmetic being redone.
      #
      # The audited background pools declare THIRTY-TWO threads between them — the scheduler (6),
      # pluginExecutor (10), pluginExecutionExecutor (8), the three queue workers (2 each), the
      # forced-rebuild executor (1) and the batch-parquet lease renewer (1) — before a single HTTP
      # or gRPC request asks for a connection, and both request layers are themselves unbounded
      # (virtual-thread-per-request, and grpc-java's default cached pool). This pool is therefore
      # SMALLER THAN ITS CALLERS ON PURPOSE, and that is safe for one specific reason: background
      # work does not hold one connection while waiting for a second, which is the shape that turns
      # a shortage into a deadlock instead of a delay. A thread that cannot get a connection waits
      # up to connection-timeout and runs again on its next tick. CheckpointEpochGuard's
      # REQUIRES_NEW runs under a non-transactional build, and CheckpointRecordedEvent is published
      # outside the guard's transaction on purpose.
      #
      # ONE EXCEPTION EXISTS, timed and worth removing rather than budgeting for.
      # PluginAuditEventListener is REQUIRES_NEW *and* AFTER_COMMIT: normally it runs on
      # pluginExecutor long after the publisher is done, but with that pool saturated (10 threads
      # and all 50 queue slots) CallerRunsPolicy runs it inline on the publishing thread, which is
      # still inside the commit synchronization holding its own connection (release happens in
      # afterCompletion, not afterCommit) — issue #171. The other exception this derivation used
      # to name — the delta-SQL worker pinning a connection across the generation semaphore —
      # was removed by #164. Introducing another changes this reasoning, not just this number.
      #
      # So the size is fixed by two bounds rather than by the peak, and ten satisfies both:
      #
      #   floor    long-holding background threads + a request reserve <= pool
      #            A "long" holder pins the connection across S3 I/O or a bounded wait instead of
      #            releasing it between statements, so queueing would stall it rather than slow it.
      #            NOTE WHICH THREADS THOSE ARE — for the scheduler it is the four ticks
      #            ScheduledTaskInventoryTest classifies Cost.LONG, NOT its six threads: a short
      #            tick that waits for a connection simply runs on its next wake, so counting the
      #            whole pool here would be the same conflation of "holds a thread" with "holds a
      #            connection" that this derivation exists to undo.
      #                4 long scheduled ticks
      #              + 2 reserved for request threads
      #              = 6 <= 10
      #            Everything else is short (one INSERT, a claim, a publish) and may queue. The
      #            two workers this used to budget as long — delta.egress and delta-sql — were
      #            shortened by #164: they no longer hold a connection across S3 or the generation
      #            semaphore, so they sit with the short consumers rather than in this floor.
      #
      #   ceiling  (maxReplicas + maxSurge) x pool + operator reserve <= max_connections
      #            The pool is per replica but max_connections is not, and every cron tick fires on
      #            every replica at the same instant, so the cluster peak is the real one:
      #                (6 from k8s/base/hpa.yaml + 1 surging during a rollout) x 10 = 70
      #                70 + 10 for superuser_reserved_connections, psql, migrations, exporters = 80
      #            against PostgreSQL's default max_connections of 100.
      #
      # THE 100 IS AN ASSUMPTION, NOT A MEASUREMENT — this repository never names the database
      # (DB_URL arrives from a secret), so the pessimistic default is the only number that can be
      # reasoned about here, and it further assumes this cluster is alone on that server. THE TEN
      # IS THEREFORE UNCHANGED ON PURPOSE: no load measurement of hikari_connections_pending or
      # hikari_connections_acquire_seconds exists, the derivation shows ten already covers what
      # must be covered, and raising a pool against an unverified max_connections is the one move
      # here whose failure is FATAL: sorry, too many clients already on every replica rather than a
      # slow query. What was missing was never the number — it was this derivation and the guard
      # that keeps it true.
      #
      # To raise it later: read `SHOW max_connections` on the actual server (and check nothing else
      # shares it — dev and stage reach (3+1) x pool each), record it here, and raise
      # DEFAULT_MAX_CONNECTIONS in BackgroundConnectionDemandTest with it; the ceiling above then
      # allows up to 12 even at PostgreSQL's default. To gain slots without touching the database,
      # shorten or lower a long holder instead.
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

# S3 Configuration
s3:
  endpoint: ${AWS_S3_ENDPOINT:https://s3.amazonaws.com}
  region: ${AWS_S3_REGION:us-east-1}
  bucket:
    name: ${AWS_S3_BUCKET_NAME:data-forge-bucket}
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  path-style-access-enabled: ${S3_PATH_STYLE_ACCESS:false}
  # Set checksum.enabled=false for GCS S3-compatibility
  # (GCS rejects AWS chunked-encoding / flexible checksums that the SDK sends by default).
  checksum:
    enabled: ${S3_CHECKSUM_ENABLED:true}

# Batch Configuration
batch:
  timeout:
    minutes: ${BATCH_TIMEOUT_MINUTES:60}

# Account Configuration
account:
  # Effective per-account concurrent batch limit, enforced by BatchLifecycleService via AccountProperties.
  max-concurrent-batches: ${ACCOUNT_MAX_CONCURRENT_BATCHES:5}

# JWT Configuration (Device Authorization Flow access tokens)
jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-to-a-secure-random-value-at-least-256-bits}
  expiration-seconds: 86400

# Auth0 Configuration
auth0:
  domain: ${AUTH0_DOMAIN:dev-example.us.auth0.com}
  management:
    client-id: ${AUTH0_MGMT_CLIENT_ID:}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
    audience: ${AUTH0_MGMT_AUDIENCE:https://dev-example.us.auth0.com/api/v2/}
    # Buffer time before token expiry to trigger refresh (default: 1 hour)
    # Prevents using tokens that are about to expire due to clock skew or network delays
    token-expiry-buffer-seconds: ${AUTH0_TOKEN_EXPIRY_BUFFER_SECONDS:3600}
  api:
    audience: ${AUTH0_AUDIENCE:https://api.dataforge.com}
    issuer: ${AUTH0_ISSUER:https://dev-example.us.auth0.com/}
    claims-namespace: ${AUTH0_CLAIMS_NAMESPACE:https://api.dataforge.com}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

server:
  # Spring Boot's default, stated explicitly because the metrics allowlist below depends on it:
  # the CIDR check reads the socket peer, and switching this to FRAMEWORK/NATIVE would let a
  # caller name its own source address in X-Forwarded-For and walk into the allowlist. Anything
  # that needs the forwarded client IP (see AuthenticationAuditLogger) parses the header itself.
  forward-headers-strategy: none

# Observability
dfm:
  observability:
    metrics-scrape:
      # Source addresses allowed to read /actuator/prometheus and /actuator/metrics/**.
      # Empty (the default) denies everyone, which is what every environment did before
      # issue #83 — an environment must opt in explicitly. In GKE this is the cluster pod
      # range the managed-Prometheus collector scrapes from, plus loopback so that
      # `kubectl port-forward` still works for a human. Comma-separated; matching is per
      # address family, so IPv6 forms (::1/128) must be listed in their own right.
      allowed-cidrs: ${METRICS_SCRAPE_ALLOWED_CIDRS:}

# Logging Configuration
logging:
  level:
    root: INFO
    com.bitbi.dfm: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Plugin Configuration
plugin:
  execution:
    # Plugin execution timeout in seconds (default: 30s per FR-008)
    timeout-seconds: ${PLUGIN_TIMEOUT_SECONDS:30}
  parquet-export:
    # One-time download link validity before first use (028)
    link-ttl-seconds: ${PLUGIN_PARQUET_EXPORT_LINK_TTL_SECONDS:3600}
    # S3 presigned URL validity after a link is consumed
    presign-ttl-seconds: ${PLUGIN_PARQUET_EXPORT_PRESIGN_TTL_SECONDS:60}
    # Keep consumed/expired download_links rows this long before purging
    purge-retention-days: ${PLUGIN_PARQUET_EXPORT_PURGE_RETENTION_DAYS:7}
    # Purge sweep cadence
    purge-interval-ms: ${PLUGIN_PARQUET_EXPORT_PURGE_INTERVAL_MS:3600000}
    # Absolute URL prefix for one-time download links; empty = derive from the request
    base-url: ${PLUGIN_PARQUET_EXPORT_BASE_URL:}
  sql-generation:
    # Maximum concurrent SQL generation operations (semaphore permits)
    max-concurrent: ${PLUGIN_SQL_GENERATION_MAX_CONCURRENT:2}
    # Timeout in seconds waiting for a semaphore permit before aborting
    semaphore-timeout-seconds: ${PLUGIN_SQL_GENERATION_SEMAPHORE_TIMEOUT_SECONDS:120}
    # JVM heap usage percentage threshold; generation aborts when usage is strictly above it.
    # 100 disables the check outright (heap usage can never exceed 100%) — issue #174.
    heap-threshold-percent: ${PLUGIN_SQL_GENERATION_HEAP_THRESHOLD_PERCENT:80}
    # Delta v2 SQL queue (026-bitbi-delta-sql): worker pool size and fallback sweep interval
    delta-max-concurrent: ${PLUGIN_SQL_GENERATION_DELTA_MAX_CONCURRENT:2}
    delta-sweep-ms: ${PLUGIN_SQL_GENERATION_DELTA_SWEEP_MS:60000}

plugins:
  bitbi:
    # Enable/disable Bit BI plugin registration (default: true)
    enabled: ${PLUGIN_BITBI_ENABLED:true}
    # Auth0 client ID for Bit BI application (for client verification)
    client-id: ${PLUGIN_BITBI_CLIENT_ID:BITBI_CLIENT_ID_PLACEHOLDER}

# Device Authorization Flow Configuration
device-authorization:
  verification-uri: ${DEVICE_AUTH_VERIFICATION_URI:https://app.dataforge.com/device-verify}
  expiration-minutes: ${DEVICE_AUTH_EXPIRATION_MINUTES:15}
  polling-interval-seconds: ${DEVICE_AUTH_POLLING_INTERVAL_SECONDS:5}
  device-code-length: ${DEVICE_AUTH_DEVICE_CODE_LENGTH:64}

# Application base URL (used for API callbacks)
app:
  api-base-url: ${APP_API_BASE_URL:https://api.dataforge.com}

# Delta Client v2 (gRPC ingestion — feature 022)
delta:
  grpc:
    # Bind and serve the Delta v2 gRPC ingestion endpoint
    enabled: ${DELTA_GRPC_ENABLED:true}
    # Port for the Delta v2 gRPC server (separate from the HTTP server.port)
    port: ${DELTA_GRPC_PORT:9090}
    # TLS for the gRPC ingestion transport (the site Bearer token travels in metadata). Off by
    # default for local/in-cluster plaintext; enable here or terminate TLS at an ingress/sidecar.
    tls:
      enabled: ${DELTA_GRPC_TLS_ENABLED:false}
      cert-path: ${DELTA_GRPC_TLS_CERT_PATH:}
      key-path: ${DELTA_GRPC_TLS_KEY_PATH:}
    # Keepalive + max connection age bound half-open/hung streams (server closes -> onError reaps).
    keepalive-seconds: ${DELTA_GRPC_KEEPALIVE_SECONDS:300}
    max-connection-age-seconds: ${DELTA_GRPC_MAX_CONN_AGE_SECONDS:3600}
  ingestion:
    # Max records a single (non-CONTINUOUS) session may buffer before it is rejected (OOM guard);
    # very large snapshots should stream in CONTINUOUS mode, which seals bounded segments.
    max-session-records: ${DELTA_MAX_SESSION_RECORDS:2000000}
    # Max cumulative serialized bytes a single session may buffer before it is rejected (byte-aware
    # OOM guard — the record cap alone let a 439k-row snapshot OOM a 1536Mi pod). Applies to every
    # session; CONTINUOUS seals reset the buffer far below it, so there it only backstops.
    # 0 = auto: an eighth of the max heap (retained heap is ~3-5x the serialized size).
    max-session-bytes: ${DELTA_MAX_SESSION_BYTES:0}
    # Staged (dropped, awaiting resume) sessions older than this are evicted and their batches failed,
    # so an abandoned session cannot leak its buffer. Must stay BELOW batch.timeout.minutes with room
    # for the sweep interval below (50 min + 5 min sweep < 60 min): a staged session outliving its
    # batch is resumable onto a batch the timeout sweeper has already reaped, which used to fail late
    # at the final commit (030). Guarded by DeltaIngestionStagedTtlConfigTest.
    staged-ttl-millis: ${DELTA_STAGED_TTL_MILLIS:3000000}
    # How often the staged-session eviction sweep runs.
    staged-sweep-millis: ${DELTA_STAGED_SWEEP_MILLIS:300000}
    # CONTINUOUS mode also seals a non-empty segment this long after the last seal (time trigger),
    # so a low-throughput stream that never reaches the record count still bounds staleness.
    continuous-seal-millis: ${DELTA_CONTINUOUS_SEAL_MILLIS:300000}
    # CONTINUOUS mode also seals once this many serialized bytes have accumulated (byte trigger),
    # so 100 fat records (each may approach the 4MB gRPC cap) cannot bloat the segment buffer.
    # Must be below max-session-bytes — validated at startup.
    continuous-seal-bytes: ${DELTA_CONTINUOUS_SEAL_BYTES:16777216}
    # Records after which a FULL_SNAPSHOT (re-baseline) seals. Deliberately far above the 100-record
    # continuous threshold: 100 bounds staleness for a trickle stream, but on a bulk snapshot it
    # would cut a 5M-row dataset into 50,000 segments, each seal stalling record intake for a full S3
    # round trip. A snapshot is bounded by continuous-seal-bytes instead; this only caps narrow rows.
    snapshot-seal-records: ${DELTA_SNAPSHOT_SEAL_RECORDS:25000}
    # Orphaned provisional segments (a snapshot whose pod died mid-stream) collected per sweep pass.
    provisional-sweep-batch: ${DELTA_PROVISIONAL_SWEEP_BATCH:500}
    provisional-sweep-millis: ${DELTA_PROVISIONAL_SWEEP_MILLIS:900000}
  checkpoint:
    # A checkpoint snapshot is written to a local file per table and streamed to S3 from there
    # (issue #112); the all-INSERT reload frame is written the same way, into the same directory
    # (issue #126). Point temp-dir at a scratch volume if the node's default tmpdir is small.
    #
    # TWO ceilings, because the two files fail differently (issue #138):
    #   * max-temp-bytes is PER TABLE and graceful — a table whose Parquet would cross it is
    #     skipped (delta.checkpoint.tables.unmaterialized{reason=parquet_failed}) and repaired by
    #     a later build's rematerialize (#128). This is the one to lower: the cost of setting it
    #     too low is a visible, self-healing hole.
    #   * max-frame-temp-bytes is for the whole-site reload frame and ABORTS the build, because
    #     the frame is the next incremental seed and there is nothing to fall back on. Setting it
    #     too low turns a disk guard into a stuck checkpoint pipeline (no pointer, no retention)
    #     on exactly the sites large enough to need one, so it is deliberately the wider of the
    #     two. Both default to the 10 GiB the single key used to carry, so an upgrade changes
    #     nothing.
    # A THIRD guard is not ours and is harsher than both: where temp-dir is a volume with a
    # sizeLimit, that limit is for the WHOLE directory and kubelet enforces it by EVICTING the
    # pod — no skip, no metric, in-flight ingest dies with it. The ceilings here are per FILE and
    # cannot bound a directory shared by several live writers, so they must be set below it with
    # room for the concurrent files: see docs/delta-client-v2-guide.md ("Sizing note") for the
    # worst-case formula. On GKE both temp-dir keys point at the `parquet-scratch` emptyDir
    # (sizeLimit 6Gi in an 8Gi ephemeral-storage request/limit, issue #131), and the ceilings for
    # that volume are declared beside it in k8s/base/configmap.yaml — the application cannot know
    # how big the directory it was handed is, so the defaults below stay generous.
    temp-dir: ${DELTA_CHECKPOINT_TEMP_DIR:${java.io.tmpdir}}
    max-temp-bytes: ${DELTA_CHECKPOINT_MAX_TEMP_BYTES:10737418240}
    # Unset, this inherits the *resolved* per-table ceiling rather than the literal 10 GiB: before
    # the split one key bounded both files, so an operator who had lowered it for a small scratch
    # disk must keep the frame bounded by that same number until they raise it deliberately. The
    # fallback is the property, not DELTA_CHECKPOINT_MAX_TEMP_BYTES, so it also follows a value set
    # through a profile yml, SPRING_APPLICATION_JSON or a CLI argument.
    max-frame-temp-bytes: ${DELTA_CHECKPOINT_MAX_FRAME_TEMP_BYTES:${delta.checkpoint.max-temp-bytes}}
    # The ceiling that is NOT about disk, and the one a growing site reaches first (issue #152).
    # The build folds the site into memory — one entry per surviving row, for the whole build — and
    # since the frame and the snapshots stream to disk, that fold is what is left scaling with the
    # site's row count. Crossing this ABORTS the build (delta.checkpoint.builds.aborted
    # {reason=fold_too_large}) with the pointer, the per-table keys and the frame untouched, which
    # is the point: without it the pod is OOMKilled instead, taking in-flight ingest with it and
    # leaving nothing to attribute the failure to.
    # 0 = auto: HALF the max heap. Capacity planning would say a quarter — two checkpoint builds
    # can be in flight in one JVM (the nightly sweep and a forced rebuild on deltaRebuildExecutor,
    # the same 2x behind the scratch budget) and the pod is still serving ingest — but this is not
    # a capacity plan: it is the last line before an OOMKill, and refusing a build is permanent.
    # Before issue #152 the seed path held two to three full-site copies at once, so a site that
    # builds successfully today can have a fold near half the heap; a quarter would have refused it
    # on the first tick after the deployment that made its build cheaper. Set the key explicitly to
    # a quarter if you want the concurrency headroom. Unlike the scratch ceilings above, this one is
    # derived rather than declared beside the deployment: the process cannot see how big its scratch
    # volume is, but it can always see its own -Xmx.
    # Counted in ESTIMATED RETAINED BYTES — a coarse object-graph estimate per row, not the wire
    # size of the records, since the fold keeps a Java object graph an order of magnitude larger
    # than its protobuf encoding. Compare it to -Xmx, not to segment sizes; a build logs its own
    # PEAK estimate at DEBUG, and WARNs once a site passes 75% of this. One night at DEBUG on
    # CheckpointService is how to size this key before lowering it.
    max-fold-bytes: ${DELTA_CHECKPOINT_MAX_FOLD_BYTES:0}
    # How long a build waits for the process's fold budget before it is DEFERRED (issue #178).
    # max-fold-bytes above bounds one fold, and one JVM can hold two — the nightly sweep and a
    # forced rebuild on deltaRebuildExecutor — so two folds at 45% of the budget each crossed
    # nothing and still OOMKilled the pod. CheckpointFoldBudget lets one build fold at a time, which
    # is what makes the number above a bound on the process rather than on a build; this key is how
    # long the second one waits for its turn.
    # Deferred, never refused: nothing is folded, uploaded, saved or counted against the site, no
    # materialize attempt is spent, and the outcome is delta.checkpoint.builds.deferred — NOT
    # delta.checkpoint.builds.aborted, whose values are the refusals that do not repair themselves.
    # The wait is bounded rather than indefinite because a build that has stalled would otherwise
    # freeze the whole nightly sweep silently and until the pod is replaced. The semaphore is fair
    # and is taken per site, so a rebuild queues behind ONE site's build, not behind the sweep:
    # 600 s is generous for that. The nightly sweep pays this wait ONCE per pass, not once per
    # site — after one spent wait it keeps visiting sites but takes the budget only when it is free,
    # and sites deferred along the way get one retry pass at the end of the tick, so a tick spends
    # at most two waits. The wait also ends early when the application starts shutting down (that
    # ending is NOT counted as a deferral), and is clamped at a day however large this is set.
    # Size it from delta.checkpoint.fold.wait (a timer over every build that reached the fold),
    # not from delta.checkpoint.duration: the budget is taken outside phase=total, so a build that
    # waited nine minutes and then ran is invisible there and never touches builds.deferred either.
    # 0 = do not wait at all.
    fold-wait-seconds: ${DELTA_CHECKPOINT_FOLD_WAIT_SECONDS:600}
    # How many nights the tick keeps retrying a table that came out of a build with no snapshot
    # (issue #149). Since #128 such a row is retried by every scheduled build, and since #137 it
    # also puts its site on the tick's work list — so a table nothing can ever materialize (no
    # declared schema, an unrenderable value) cost a frame download, a whole-site fold and an
    # attempt every night, forever, behind the scheduler's single lock.
    # Counted in attempts rather than seconds because the retry runs from a once-a-night cron: a
    # delay would only ever express itself as skipped nights, and the counter survives a restart
    # without a clock. What it bounds is the DEDICATED retry only — a site with new segments is
    # visited for its segments, and the incremental build there writes every table in its fold
    # whatever this says. Giving up is neither silent nor final: delta.checkpoint.tables.given-up
    # gauges the population, and a forced rebuild (POST .../delta/checkpoints/rebuild), an
    # incremental success, a re-baseline or a wipe all put the row back.
    max-materialize-attempts: ${DELTA_CHECKPOINT_MAX_MATERIALIZE_ATTEMPTS:5}
  parquet:
    # Row-group budget for every V2 Parquet writer (checkpoint snapshots, per-segment egress and
    # completed-batch artifacts). A writer buffers one row group in heap before flushing, so with
    # file-backed output this is the last multiplier of peak memory: open writers x this value.
    # parquet-mr's implicit default is ~128 MB, which a grouped batch build (one writer per claimed
    # table) multiplies past a 2-3 Gi pod. Lowering it further costs compression and, on a multi-GB
    # batch artifact, multiplies the footer metadata every reader parses up front.
    row-group-bytes: ${DELTA_PARQUET_ROW_GROUP_BYTES:16777216}
    # Orphan sweep for file-backed scratch left behind when a process dies between createTempFile
    # and finally (issue #127). Age is the only safe filter on a volume this process may share: a
    # sibling replica may be writing into it, and the batch-parquet lease is renewed for the life
    # of a live build, so it is not a bound on file age. Default 4 h must exceed the longest
    # create-to-delete interval (completed-batch files are created before replay starts). Raise it
    # if a build can run longer.
    scratch-orphan-age-seconds: ${DELTA_PARQUET_SCRATCH_ORPHAN_AGE_SECONDS:14400}
    scratch-orphan-sweep-ms: ${DELTA_PARQUET_SCRATCH_ORPHAN_SWEEP_MS:3600000}
    # Set this only where the temp-dirs above are written by this pod and nobody else — the
    # deployed `parquet-scratch` emptyDir, which survives a container restart but not the pod
    # (issue #141). It adds a second rule to the sweep: a scratch file older than this JVM
    # belongs to a dead predecessor and goes regardless of age, so a liveness/OOM kill mid-build
    # does not park a full set of files on a sizeLimit'ed volume for four hours. The cutoff is the
    # later of the two rules, so it is never softer than the age filter, and files this JVM
    # created are never in scope. Leave it false for a shared volume (an RWX PersistentVolume,
    # several replicas on one host path): there a file older than this JVM can belong to a live
    # sibling. k8s/base/configmap.yaml sets it true next to the temp-dir keys it describes.
    scratch-private-to-pod: ${DELTA_PARQUET_SCRATCH_PRIVATE_TO_POD:false}
    # The only key that bounds the scratch DIRECTORY rather than a file in it (issue #150). The
    # three *_MAX_TEMP_BYTES ceilings above are per file, and nothing bounds how many files are
    # open at once: a completed-batch build opens one per claimed table, so a ten-table batch puts
    # ten files on the volume however low that ceiling is set. This is charged as bytes are written
    # (not reserved at the ceiling, which for artifacts in the low hundreds of MiB would refuse a
    # three-table batch outright), and a writer that crosses it is stopped mid-file exactly as one
    # crossing its own ceiling is — but as a TRANSIENT refusal: the artifact is fine, the directory
    # is busy. A checkpoint table is skipped
    # (delta.checkpoint.tables.unmaterialized{reason=scratch_budget}), a completed-batch artifact is
    # retried with backoff, the frame ends the build without touching
    # delta.checkpoint.builds.aborted (whose values are permanent by contract, #153).
    # 0 = unbounded, the shipped default, because the application cannot know how large the
    # directory it was handed is — the deployed value is declared beside the volume in
    # k8s/base/configmap.yaml. Unbounded still MEASURES: delta.parquet.scratch.bytes follows the
    # writers either way, and max(that gauge) is how this key is sized before it is turned on.
    # Per JVM, so it is a real bound only where scratch-private-to-pod above holds.
    max-scratch-bytes: ${DELTA_PARQUET_MAX_SCRATCH_BYTES:0}
  egress:
    # Concurrent delta-Parquet egress workers per instance (Task 8)
    max-concurrent: ${DELTA_EGRESS_MAX_CONCURRENT:2}
    # Fallback sweep interval (ms) picking up segments missed by the commit-time wake
    sweep-ms: ${DELTA_EGRESS_SWEEP_MS:60000}
  batch-parquet:
    # Completed-session artifacts are separate from the realtime per-segment egress above.
    max-concurrent: ${DELTA_BATCH_PARQUET_MAX_CONCURRENT:2}
    sweep-ms: ${DELTA_BATCH_PARQUET_SWEEP_MS:60000}
    # Base failure backoff; doubles per attempt (capped at 64x), so the attempt ceiling below spans
    # a window wide enough to ride out a transient S3 outage rather than ~5 flat minutes.
    retry-delay-seconds: ${DELTA_BATCH_PARQUET_RETRY_DELAY_SECONDS:60}
    # Attempt ceiling per artifact. A deterministic failure (no declared schema, unrenderable data)
    # would otherwise be rebuilt forever; past the cap the row becomes ABANDONED and answers 404.
    # With the doubling backoff above, 7 attempts span 60+120+240+480+960+1920s ~= 63 min, so an
    # outage has to outlast an hour before in-flight artifacts are given up on.
    max-attempts: ${DELTA_BATCH_PARQUET_MAX_ATTEMPTS:7}
    # How long a BUILDING claim is honoured with no sign of life. The owner renews it every third
    # of this while it builds, so it bounds worker death, not how long a build may legitimately run.
    lease-seconds: ${DELTA_BATCH_PARQUET_LEASE_SECONDS:1800}
    # A completed artifact is file-backed; refuse upload if the local file exceeds this policy.
    # Crossing it abandons that artifact on its first, deterministic attempt.
    # PER FILE, like the checkpoint ceilings above — and this path is the one that multiplies:
    # a batch build opens one scratch file per claimed table at once, and max-concurrent (2)
    # builds can run together, so the directory sees 2 x tables x file at peak while this key
    # only ever sees one file. Lowering it therefore shrinks the peak roughly in proportion, but
    # never bounds it: no per-file ceiling can, which is why the directory-wide reservation is
    # tracked separately (issue #150). The directory is bounded by the deployment, not here:
    # temp-dir points at the `parquet-scratch` emptyDir (sizeLimit 6Gi) on GKE, crossing THAT is
    # a kubelet eviction rather than a per-artifact refusal, and the value used on that volume is
    # declared beside it in k8s/base/configmap.yaml. Worst case and how to recompute the volume
    # budget: docs/delta-client-v2-guide.md ("Sizing note"), issues #131 and #138.
    max-temp-bytes: ${DELTA_BATCH_PARQUET_MAX_TEMP_BYTES:10737418240}
    temp-dir: ${DELTA_BATCH_PARQUET_TEMP_DIR:${java.io.tmpdir}}

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
