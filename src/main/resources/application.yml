spring:
  application:
    name: data-forge-middleware

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${auth0.domain}/
          audiences: ${auth0.api-audience}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dfm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 130MB
      enabled: true

# S3 Configuration
s3:
  endpoint: ${AWS_S3_ENDPOINT:https://s3.amazonaws.com}
  region: ${AWS_S3_REGION:us-east-1}
  bucket:
    name: ${AWS_S3_BUCKET_NAME:data-forge-bucket}
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  path-style-access-enabled: false

# Batch Configuration
batch:
  timeout:
    minutes: ${BATCH_TIMEOUT_MINUTES:60}
  max:
    active:
      per-account: ${BATCH_MAX_ACTIVE_PER_ACCOUNT:10}

# Account Configuration
account:
  max-concurrent-batches: ${ACCOUNT_MAX_CONCURRENT_BATCHES:5}

# Upload Configuration
upload:
  max:
    file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:128}
    files-per-batch: ${UPLOAD_MAX_FILES_PER_BATCH:1000}
  retry:
    attempts: 3
    delay-ms: 1000

# JWT Configuration (for client API backward compatibility)
jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-to-a-secure-random-value-at-least-256-bits}
  expiration-seconds: 86400

# Auth0 Configuration
auth0:
  domain: ${AUTH0_DOMAIN:dev-example.us.auth0.com}
  management:
    client-id: ${AUTH0_MGMT_CLIENT_ID:}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
    audience: ${AUTH0_MGMT_AUDIENCE:https://dev-example.us.auth0.com/api/v2/}
    # Buffer time before token expiry to trigger refresh (default: 1 hour)
    # Prevents using tokens that are about to expire due to clock skew or network delays
    token-expiry-buffer-seconds: ${AUTH0_TOKEN_EXPIRY_BUFFER_SECONDS:3600}
  api:
    audience: ${AUTH0_AUDIENCE:https://api.dataforge.com}
    issuer: ${AUTH0_ISSUER:https://dev-example.us.auth0.com/}
    claims-namespace: ${AUTH0_CLAIMS_NAMESPACE:https://api.dataforge.com}
  database-connection: Username-Password-Authentication

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.bitbi.dfm: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
