spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false

auth0:
  domain: ${AUTH0_DOMAIN}
  management-client-id: ${AUTH0_MGMT_CLIENT_ID}
  management-client-secret: ${AUTH0_MGMT_CLIENT_SECRET}
  # The resource-server audience comes from auth0.api.audience in application.yml, which reads the
  # same ${AUTH0_AUDIENCE} with the same default. api-audience existed only to feed that placeholder.
  database-connection: Username-Password-Authentication
  password-reset-ttl-seconds: 86400
  roles-namespace: https://api.dataforge.com/roles

logging:
  level:
    root: INFO
    com.bitbi.dfm: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
