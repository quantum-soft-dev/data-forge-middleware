spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false

# Auth0Properties is @ConfigurationProperties("auth0") with nested management/api groups, so only
# the nested form binds. The flat keys that used to sit here (management-client-id,
# management-client-secret, roles-namespace, password-reset-ttl-seconds) bound to nothing and were
# read by nothing; the Management credentials already come from the same AUTH0_MGMT_* variables via
# auth0.management.* in application.yml. Auth0PropertyBindingTest keeps orphans from reappearing.
#
# The resource-server audience comes from auth0.api.audience in application.yml, which reads the
# same ${AUTH0_AUDIENCE} with the same default. api-audience existed only to feed that placeholder.
auth0:
  domain: ${AUTH0_DOMAIN}

logging:
  level:
    root: INFO
    com.bitbi.dfm: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
