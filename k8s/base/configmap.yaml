apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-config
  namespace: forge
data:
  # --- Spring / runtime ---------------------------------------------------------------
  SPRING_PROFILES_ACTIVE: "prod"          # the AWS/GCS-capable profile (not localstack)
  # --- Redis (in-cluster for dev; Memorystore for stage/prod via overlay) -------------
  SPRING_DATA_REDIS_HOST: "forge-redis"
  SPRING_DATA_REDIS_PORT: "6379"
  # --- Object storage: GCS via S3-compatible XML API ----------------------------------
  AWS_S3_ENDPOINT: "https://storage.googleapis.com"
  AWS_S3_REGION: "auto"
  AWS_S3_BUCKET_NAME: "dfm-uploads"       # overridden per environment in overlays
  S3_PATH_STYLE_ACCESS: "true"
  S3_CHECKSUM_ENABLED: "false"            # GCS rejects AWS chunked-encoding / flexible checksums
  # --- Auth0 (non-secret; domain/audience/issuer). Mgmt client id/secret live in forge-secrets.
  # Values are environment-specific and set/overridden in overlays.
  AUTH0_AUDIENCE: "https://api.dataforge.com"
  AUTH0_CLAIMS_NAMESPACE: "https://api.dataforge.com"
  # --- App URLs (internal-only deployment) --------------------------------------------
  APP_API_BASE_URL: "http://forge-backend.forge.svc.cluster.local:8080"
  # --- Delta v2 file-backed Parquet scratch --------------------------------------------
  # Both writers default to java.io.tmpdir, i.e. the container's writable layer, which
  # nothing bounds. Point them at the `parquet-scratch` emptyDir mounted by
  # deployment-backend.yaml so one declared sizeLimit covers the directory they share.
  # The two prefixes (`checkpoint-*`, `batch-parquet-*`) keep them apart inside it, and
  # ParquetScratchOrphanSweeper deduplicates the two paths before sweeping.
  DELTA_CHECKPOINT_TEMP_DIR: "/scratch/parquet"
  DELTA_BATCH_PARQUET_TEMP_DIR: "/scratch/parquet"
  # That emptyDir is pod-private and is cleared only when the pod goes away, so it outlives a
  # liveness or OOM kill. Declaring it lets the sweeper also drop scratch older than the running
  # JVM — a dead predecessor's files — instead of holding them for the full four-hour age window
  # on a volume with a sizeLimit (issue #141). This is a claim about the mount above: move the
  # temp dirs off the emptyDir and this has to go with them.
  DELTA_PARQUET_SCRATCH_PRIVATE_TO_POD: "true"
  # --- Plugin (Bit BI) ----------------------------------------------------------------
  PLUGIN_BITBI_ENABLED: "true"
