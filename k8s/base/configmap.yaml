apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-config
  namespace: forge
data:
  # --- Spring / runtime ---------------------------------------------------------------
  SPRING_PROFILES_ACTIVE: "prod"          # the AWS/GCS-capable profile (not localstack)
  # --- Redis (in-cluster for dev; Memorystore for stage/prod via overlay) -------------
  SPRING_DATA_REDIS_HOST: "forge-redis"
  SPRING_DATA_REDIS_PORT: "6379"
  # --- Object storage: GCS via S3-compatible XML API ----------------------------------
  AWS_S3_ENDPOINT: "https://storage.googleapis.com"
  AWS_S3_REGION: "auto"
  AWS_S3_BUCKET_NAME: "dfm-uploads"       # overridden per environment in overlays
  S3_PATH_STYLE_ACCESS: "true"
  S3_CHECKSUM_ENABLED: "false"            # GCS rejects AWS chunked-encoding / flexible checksums
  # --- Auth0 (non-secret; domain/audience/issuer). Mgmt client id/secret live in forge-secrets.
  # Values are environment-specific and set/overridden in overlays.
  AUTH0_AUDIENCE: "https://api.dataforge.com"
  AUTH0_CLAIMS_NAMESPACE: "https://api.dataforge.com"
  # --- App URLs (internal-only deployment) --------------------------------------------
  APP_API_BASE_URL: "http://forge-backend.forge.svc.cluster.local:8080"
  # --- Delta v2 file-backed Parquet scratch --------------------------------------------
  # Both writers default to java.io.tmpdir, i.e. the container's writable layer, which
  # nothing bounds. Point them at the `parquet-scratch` emptyDir mounted by
  # deployment-backend.yaml so one declared sizeLimit covers the directory they share.
  # The two prefixes (`checkpoint-*`, `batch-parquet-*`) keep them apart inside it, and
  # ParquetScratchOrphanSweeper deduplicates the two paths before sweeping.
  DELTA_CHECKPOINT_TEMP_DIR: "/scratch/parquet"
  DELTA_BATCH_PARQUET_TEMP_DIR: "/scratch/parquet"
  # That emptyDir is pod-private and is cleared only when the pod goes away, so it outlives a
  # liveness or OOM kill. Declaring it lets the sweeper also drop scratch older than the running
  # JVM — a dead predecessor's files — instead of holding them for the full four-hour age window
  # on a volume with a sizeLimit (issue #141). This is a claim about the mount above: move the
  # temp dirs off the emptyDir and this has to go with them.
  DELTA_PARQUET_SCRATCH_PRIVATE_TO_POD: "true"
  # Per-file ceilings for that volume (issue #138). The application defaults are 10 GiB — above
  # the 6Gi sizeLimit — so without these the binding constraint is the volume, and its failure
  # mode is a kubelet EVICTION of the pod rather than a skipped table or an abandoned artifact.
  # The volume size is declared in deployment-backend.yaml, so the ceilings that must sit below
  # it are declared here, beside the temp dirs that put the writers on it — the application has
  # no way to know how large the directory it was handed is.
  #
  # What bounds the DIRECTORY is the key below, not these three (issue #150). Until it existed the
  # budget had to be a multiplier estimate — 2 x max(table, frame) + max-concurrent x batch — whose
  # batch term assumed ONE claimed table per build, while a real build opens one file per claimed
  # table. That was a floor on the guarantee rather than a budget: no per-file ceiling can bound a
  # count. DELTA_PARQUET_MAX_SCRATCH_BYTES bounds the sum directly, so these three keep only their
  # per-artifact job — refusing one deterministically oversized file with the semantics that suit
  # it — and no longer have to be multiplied out.
  #
  # The frame is deliberately the widest ceiling, because its failure is the expensive one. Since
  # #150 raising it no longer costs 2 GiB of volume per GiB — the directory budget below is what
  # has to fit — but it must stay at or under that budget, or the directory refuses first and the
  # frame's own graceful accounting never speaks.
  #
  # For scale, the largest artifact on record is in the low hundreds of MiB, so these are 3-5x
  # headroom. NONE of the three refusals repairs itself if the artifact is deterministically too
  # big — each needs the ceiling raised:
  #   * table  -> skipped, and on a seq-advancing build s3_key_parquet is DETACHED, so the table
  #               404s for Bit BI / Parquet Export and the nightly retry fails the same way (#149)
  #   * frame  -> the build aborts, the pointer and retention freeze, and every following build
  #               re-uploads a full set of snapshots at a new seq, orphaning the previous ones (#153)
  #   * batch  -> ABANDONED on the first attempt and 404 thereafter; raise the key and requeue via
  #               POST /api/v1/sites/{siteId}/delta/batches/{batchId}/parquet-artifacts/{id}/requeue
  # In all three the records themselves are still in the changelog segments and their per-segment
  # Parquet; what is lost is the derived artifact.
  # Before rolling this out to a site that has been running a while, check the assumption against
  # reality — it takes one listing:
  #   gsutil du -h gs://<bucket>/checkpoints/<siteId>/_frame/   # largest frame
  #   gsutil du -h gs://<bucket>/egress/<siteId>/batches/       # largest batch artifact
  # A frame already larger than the frame ceiling below would go from "works" to "the build aborts
  # every night" (see #153), which is the one regression these values can cause.
  DELTA_CHECKPOINT_MAX_TEMP_BYTES: "1073741824"
  DELTA_CHECKPOINT_MAX_FRAME_TEMP_BYTES: "1610612736"
  DELTA_BATCH_PARQUET_MAX_TEMP_BYTES: "1073741824"
  # The one key that bounds the whole directory (issue #150), and the only reason the ceilings
  # above no longer need a multiplier. 5Gi = the 6Gi sizeLimit less a gigabyte kept free: for
  # scratch a dead container left behind (it survives on the pod-private volume until the next
  # sweep tick, #141, and its owner is gone so no lease covers it) and for the fact that kubelet
  # acts on usage EXCEEDING the limit rather than reaching it. Solving to exact equality with
  # sizeLimit would make the budget itself an eviction.
  # It is per JVM, which is a true bound here only because DELTA_PARQUET_SCRATCH_PRIVATE_TO_POD
  # above says the directory belongs to this pod; on a shared volume it would be a per-replica
  # share. ParquetScratchCeilingBudgetTest recomputes it from these manifests, so raising it or
  # shrinking sizeLimit on its own fails the build.
  # The last DELTA_CHECKPOINT_MAX_FRAME_TEMP_BYTES of this budget cannot be taken by batch
  # writers (issue #193): that is the reserved share for the nightly checkpoint frame, which
  # holds one scratch file at a time. 5Gi - 1.5Gi leaves 3.5Gi for completed-batch artifacts.
  DELTA_PARQUET_MAX_SCRATCH_BYTES: "5368709120"
  # --- Plugin (Bit BI) ----------------------------------------------------------------
  PLUGIN_BITBI_ENABLED: "true"
