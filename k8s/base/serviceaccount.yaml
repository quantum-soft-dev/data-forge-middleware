apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-app
  namespace: forge
  annotations:
    # Workload Identity: links this K8s SA to the GCP SA created by Terraform.
    # The GCP SA email is set per-environment via Kustomize overlay patch.
    iam.gke.io/gcp-service-account: REPLACE_WITH_GCP_SA_EMAIL
