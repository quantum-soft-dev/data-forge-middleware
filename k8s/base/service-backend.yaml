apiVersion: v1
kind: Service
metadata:
  name: forge-backend
  namespace: forge
  labels:
    app: forge-backend
spec:
  type: ClusterIP
  selector:
    app: forge-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    # Delta Client v2 gRPC ingestion (DeltaIngestionService)
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
