apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-backend
  namespace: forge
  labels:
    app: forge-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forge-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime: keep all current pods up during rollout
  template:
    metadata:
      labels:
        app: forge-backend
    spec:
      serviceAccountName: forge-app
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # Image is set per-environment via Kustomize overlay
          image: us-central1-docker.pkg.dev/bitbi-production/forge-app/backend:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: forge-config
            - secretRef:
                name: forge-secrets
          # ephemeral-storage is declared because the Delta v2 Parquet writers are
          # file-backed (issues #112/#126/#127/#131): they materialize checkpoint
          # snapshots, the all-tables reload frame and completed-batch artifacts on
          # local disk before streaming them to S3. Without a *request* the scheduler
          # does not account for that disk at all when placing pods, so two builds
          # could push a node into disk pressure and evict unrelated workloads.
          #
          # The request/limit covers the whole container: the parquet-scratch emptyDir
          # below AND the writable layer (logs, JVM crash dumps). Budget:
          #   6Gi  scratch volume (sizeLimit, see `volumes` at the bottom)
          # + 2Gi  writable layer / logs headroom
          # = 8Gi
          # Request == limit so the amount the scheduler reserves is exactly the amount
          # kubelet enforces (GKE Autopilot normalizes these anyway, and caps pod
          # ephemeral storage at 10Gi — keep the total below that).
          # Recomputing the budget, and its failure mode, are documented in
          # docs/delta-client-v2-guide.md ("Sizing note") — read that before changing it.
          #
          # FIRST ROLLOUT: this is the first time ephemeral-storage participates in
          # scheduling. With maxUnavailable 0 / maxSurge 1 the surge pod must be placed
          # before an old one goes away, so a node pool without 8Gi of allocatable
          # ephemeral-storage free leaves it Pending and the rollout simply stalls —
          # `kubectl rollout status` times out with no obvious cause. Check
          # `kubectl describe node | grep -A5 Allocated` before the first deploy-dev/* tag.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "8Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
              ephemeral-storage: "8Gi"
          volumeMounts:
            # Shared scratch for both file-backed Parquet writers. DELTA_CHECKPOINT_TEMP_DIR
            # and DELTA_BATCH_PARQUET_TEMP_DIR point here (k8s/base/configmap.yaml) instead
            # of the container's writable layer (java.io.tmpdir), so the emptyDir sizeLimit
            # bounds the directory the two of them share.
            - name: parquet-scratch
              mountPath: /scratch/parquet
          # Slow boot: Flyway migrations + JVM warmup can take minutes.
          # startupProbe gates liveness/readiness until the app is actually up.
          # timeoutSeconds 5 everywhere: the default 1s is razor-thin under GC
          # pressure — during a heavy Delta ingest a stop-the-world pause makes
          # the health endpoint miss 1s, three misses get the container killed
          # mid-stream, and the client sees its upload reset.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60   # up to ~10 min to become ready
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        # emptyDir, deliberately not a PersistentVolume: the scratch dies with the pod, so
        # nothing accumulates across pod generations. Default medium (node disk) —
        # `medium: Memory` would be a tmpfs charged against the container's memory limit
        # instead.
        # This is per POD, not per container. Unlike the writable layer it SURVIVES a
        # liveness/OOM kill, so within one pod's lifetime ParquetScratchOrphanSweeper (#127)
        # is load-bearing rather than belt-and-braces: a dead attempt's files hold the volume
        # while its batch claim is retried after 30 min. Because the volume is pod-private,
        # DELTA_PARQUET_SCRATCH_PRIVATE_TO_POD (configmap.yaml, #141) lets the restarted
        # container drop them on its first sweep tick instead of holding them for the 4h
        # orphan age — so the residue term in the sizing note is one sweep interval. Moving
        # the temp dirs off this volume means dropping that flag in the same commit.
        # sizeLimit is enforced by kubelet: crossing it EVICTS the pod. It is not a
        # graceful, per-table skip like delta.*.max-temp-bytes — see the sizing note in
        # docs/delta-client-v2-guide.md. Since issue #138 the per-file ceilings in
        # configmap.yaml are set to a third of this number each, so the application refuses
        # first; changing this value means revisiting them (a test enforces the ratio).
        # Directory permissions: emptyDir is created 0777, so the non-root `dfm` user
        # from the image can write to it without an fsGroup.
        - name: parquet-scratch
          emptyDir:
            sizeLimit: 6Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: forge-backend
