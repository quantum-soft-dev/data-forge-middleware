apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-backend
  namespace: forge
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          # `ephemeral-storage` is deliberately NOT repeated here: this is a strategic
          # merge patch and `requests`/`limits` are maps, so the base declaration (8Gi,
          # see k8s/base/deployment-backend.yaml) merges in key by key and survives.
          # Verified with `kubectl kustomize k8s/overlays/stage`. Do not convert this to
          # a JSON-6902 `replace` on the whole `resources` object — that would silently
          # drop the disk budget and the scheduler would stop reserving for it.
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
      topologySpreadConstraints: []
