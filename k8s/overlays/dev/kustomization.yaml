apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - redis.yaml            # in-cluster Redis (dev only; stage/prod use Memorystore)
  - gateway.yaml          # external GKE Gateway (test.dfm.bitbi.io) + HTTPRoutes + health check

# Override images to the bitbi-dev Artifact Registry.
# Tags are overridden to the commit SHA at deploy time via `kustomize edit set image`.
images:
  - name: us-central1-docker.pkg.dev/bitbi-production/forge-app/backend
    newName: us-central1-docker.pkg.dev/bitbi-dev/forge-app/backend
    newTag: "2917718"
  - name: us-central1-docker.pkg.dev/bitbi-production/forge-app/frontend
    newName: us-central1-docker.pkg.dev/bitbi-dev/forge-app/frontend
    newTag: "2917718"

patches:
  - path: deployment-backend-patch.yaml
    target:
      kind: Deployment
      name: forge-backend
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: forge-config
  - path: configmap-frontend-patch.yaml
    target:
      kind: ConfigMap
      name: forge-frontend-config
  - path: serviceaccount-patch.yaml
    target:
      kind: ServiceAccount
      name: forge-app
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: forge-backend-hpa
  - path: service-frontend-neg-patch.yaml
    target:
      kind: Service
      name: forge-frontend
  - path: service-backend-grpc-patch.yaml
    target:
      kind: Service
      name: forge-backend
  # appProtocol on the grpc port (index 1 in base) — the GKE Gateway controller
  # keys the LB backend protocol off this field. JSON patch because kustomize's
  # strategic merge drops appProtocol from ServicePort.
  - target:
      kind: Service
      name: forge-backend
    patch: |-
      - op: add
        path: /spec/ports/1/appProtocol
        value: HTTP2
