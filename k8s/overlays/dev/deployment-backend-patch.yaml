apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-backend
  namespace: forge
spec:
  replicas: 1            # dev: single replica
  template:
    spec:
      containers:
        - name: backend
          # Sized for Delta v2 full-snapshot ingest: a non-CONTINUOUS session
          # buffers every streamed record on-heap — a 439k-row snapshot OOMed the
          # previous 1536Mi limit (~1.15Gi heap at MaxRAMPercentage=75) and the
          # liveness kill reset the client's stream mid-upload. The byte-aware
          # guard (delta.ingestion.max-session-bytes, auto = maxHeap/8) now
          # rejects such a session cleanly instead of OOMing, but this memory is
          # still what lets that legit snapshot size actually succeed.
          #
          # `ephemeral-storage` is deliberately NOT repeated here: this is a strategic
          # merge patch and `requests`/`limits` are maps, so the base declaration (8Gi,
          # see k8s/base/deployment-backend.yaml) merges in key by key and survives.
          # Verified with `kubectl kustomize k8s/overlays/dev`. Do not convert this to a
          # JSON-6902 `replace` on the whole `resources` object — that would silently
          # drop the disk budget and the scheduler would stop reserving for it.
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          # Self-signed cert for the Delta gRPC port (9090): Google's external ALB
          # requires TLS to h2 backends but does not validate the cert. Created
          # out-of-band (never in git) — see deploy/gke/README.md "gRPC ingestion".
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/forge/grpc-tls
              readOnly: true
      volumes:
        - name: grpc-tls
          secret:
            secretName: forge-backend-grpc-tls
      topologySpreadConstraints: []   # dev: no zone spreading (single replica)
