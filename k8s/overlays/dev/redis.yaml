# In-cluster Redis for the dev environment only (Spring Cache backing store).
# No persistence, no auth — ephemeral cache. stage/prod use Memorystore instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-redis
  namespace: forge
  labels:
    app: forge-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forge-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: forge-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]   # cache only, no persistence
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: forge-redis
  namespace: forge
  labels:
    app: forge-redis
spec:
  type: ClusterIP
  selector:
    app: forge-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
