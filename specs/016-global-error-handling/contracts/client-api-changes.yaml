openapi: 3.0.3
info:
  title: Client API Changes - Global Error Handling
  description: Changes to existing client API for global error handling
  version: 1.0.0

servers:
  - url: /api/dfc
    description: Device Forge Client API

paths:
  /error:
    post:
      summary: Log standalone (global) error
      description: |
        Logs an error not associated with any batch.
        **CHANGE**: Added optional `severity` field to request body.
      operationId: logStandaloneError
      tags:
        - Error Logging
      security:
        - jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogErrorRequest'
      responses:
        '204':
          description: Error logged successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /error/{batchId}:
    post:
      summary: Log batch-associated error
      description: |
        Logs an error associated with a specific batch.
        **CHANGE**: Added optional `severity` field to request body.
      operationId: logBatchError
      tags:
        - Error Logging
      security:
        - jwt: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogErrorRequest'
      responses:
        '201':
          description: Error logged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Custom JWT token (HMAC-SHA256)

  schemas:
    LogErrorRequest:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          maxLength: 100
          description: Error category (e.g., "FILE_SYSTEM_ERROR", "CONFIG_ERROR")
        message:
          type: string
          maxLength: 10000
          description: Detailed error description
        severity:
          $ref: '#/components/schemas/ErrorSeverity'
          description: |
            **NEW FIELD** - Error severity level.
            Optional, defaults to ERROR if not provided.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Optional key-value metadata.
            Constraints: max 20 entries, max 100 char keys, 10KB total.

    ErrorLogResponse:
      type: object
      required:
        - id
        - siteId
        - type
        - title
        - message
        - severity
        - isRead
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        title:
          type: string
        message:
          type: string
        stackTrace:
          type: string
          nullable: true
        clientVersion:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        severity:
          $ref: '#/components/schemas/ErrorSeverity'
          description: "**NEW FIELD**"
        isRead:
          type: boolean
          description: "**NEW FIELD** - Always false for newly created errors"
        occurredAt:
          type: string
          format: date-time

    ErrorSeverity:
      type: string
      enum:
        - CRITICAL
        - ERROR
        - WARNING
        - INFO
      default: ERROR
      description: |
        Error severity level:
        - CRITICAL: System failure, data loss risk
        - ERROR: Operation failed (default)
        - WARNING: Degraded performance, recoverable
        - INFO: Informational, expected condition

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied (batch doesn't belong to site)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
