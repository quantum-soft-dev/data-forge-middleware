version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dfm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Only dfm database needed (Keycloak removed after Auth0 migration)
      POSTGRES_MULTIPLE_DATABASES: dfm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dfm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dfm-network

  redis:
    image: redis:7-alpine
    container_name: dfm-redis
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dfm-network

  localstack:
    image: localstack/localstack:3.8
    container_name: dfm-localstack
    environment:
      SERVICES: s3
      PERSISTENCE: 1
      DEBUG: 1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dfm-network

  dfm-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dfm-backend
    environment:
      # Spring profiles
      SPRING_PROFILES_ACTIVE: dev
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dfm
      SPRING_DATASOURCE_USERNAME: dfm
      SPRING_DATASOURCE_PASSWORD: dfm_password
      # S3
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET_NAME: dfm-uploads
      # Auth0 (replaces Keycloak)
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.dataforge.com}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis_password
      # JWT (for backward compatibility with client API)
      JWT_SECRET: change-this-secret-in-production-minimum-256-bits-required-for-hmac-sha256-algorithm
      JWT_EXPIRATION: 86400
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_BITBI_DFM: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - dfm-network

volumes:
  postgres_data:
  redis_data:
  localstack_data:

networks:
  dfm-network:
    driver: bridge
